<script>
    window.Flux = {
        applyAppearance (appearance) {
            let applyDark = () => document.documentElement.classList.add('dark')
            let applyLight = () => document.documentElement.classList.remove('dark')

            if (appearance === 'system') {
                let media = window.matchMedia('(prefers-color-scheme: dark)')

                window.localStorage.removeItem('flux.appearance')

                media.matches ? applyDark() : applyLight()
            } else if (appearance === 'dark') {
                window.localStorage.setItem('flux.appearance', 'dark')

                applyDark()
            } else if (appearance === 'light') {
                window.localStorage.setItem('flux.appearance', 'light')

                applyLight()
            }
        }
    }

    window.Flux.applyAppearance(window.localStorage.getItem('flux.appearance') || 'system')
</script>

            /* Skip Link Styles */

            }

            /* Background Pattern */
            .auth-background {
                position: fixed;
                inset: 0;
                z-index: -1;
                overflow: hidden;
            }

            .auth-background::before {
                content: '';
                position: absolute;
                width: 200%;
                height: 200%;
                top: -50%;
                left: -50%;
                background:
                    radial-gradient(circle at 20% 80%, var(--color-accent-light, rgba(99, 102, 241, 0.15)) 0%, transparent 50%),
                    radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 40% 40%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
                animation: backgroundPulse 15s ease-in-out infinite;
            }

            @keyframes backgroundPulse {
                0%, 100% { transform: translate(0, 0) rotate(0deg); }
                25% { transform: translate(2%, 2%) rotate(1deg); }
                50% { transform: translate(0, 4%) rotate(0deg); }
                75% { transform: translate(-2%, 2%) rotate(-1deg); }
            }

            /* Floating Orbs */
            .floating-orb {
                position: absolute;
                border-radius: 50%;
                filter: blur(60px);
                opacity: 0.5;
                animation: float 20s ease-in-out infinite;
                pointer-events: none;
            }

            .orb-1 {
                width: 300px;
                height: 300px;
                top: 10%;
                left: 10%;
                background: var(--color-accent, #6366f1);
                animation-delay: 0s;
            }

            .orb-2 {
                width: 250px;
                height: 250px;
                bottom: 20%;
                right: 15%;
                background: #8b5cf6;
                animation-delay: -5s;
            }

            .orb-3 {
                width: 200px;
                height: 200px;
                top: 50%;
                left: 60%;
                background: #06b6d4;
                animation-delay: -10s;
            }

            @keyframes float {
                0%, 100% { transform: translateY(0) scale(1); }
                50% { transform: translateY(-30px) scale(1.05); }
            }

            /* Grid Pattern */
            .grid-pattern {
                position: absolute;
                inset: 0;
                background-image:
                    linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
                background-size: 50px 50px;
                mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
                pointer-events: none;
            }

            /* Card Glassmorphism */
            .auth-card {
                background: rgba(255, 255, 255, 0.95) !important;
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 2px solid var(--color-accent, #6366f1) !important;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            }

            .dark .auth-card {
                background: rgba(30, 30, 35, 0.95) !important;
                border: 2px solid var(--color-accent, #6366f1) !important;
            }

            /* Card Shine Effect */
            .auth-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 50%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
                transform: skewX(-25deg);
                transition: left 0.5s;
            }

            .auth-card:hover::before {
                left: 100%;
                transition: left 0.7s;
            }

            /* Footer */
            .auth-footer {
                font-size: 0.875rem;
                color: rgba(0, 0, 0, 0.6);

            .auth-footer a:hover {
                color: var(--color-accent, #6366f1) !important;
                text-decoration: underline;
            }

            /* Animation Classes */
            .fade-in-up {
                animation: fadeInUp 0.5s ease-out forwards;
                opacity: 0;
                transform: translateY(20px);
            }

            @keyframes fadeInUp {
                to { opacity: 1; transform: translateY(0); }
            }

            .stagger-1 { animation-delay: 0.1s; }
            .stagger-2 { animation-delay: 0.2s; }
            .stagger-3 { animation-delay: 0.3s; }
            .stagger-4 { animation-delay: 0.4s; }

            /* Responsive */
            @media (max-width: 640px) {
                .auth-card {
                    margin: 0.5rem;
                    border-radius: 0.75rem;

                    height: 28px !important;

            }

            /* Tablet responsive */
            @media (min-width: 641px) and (max-width: 1024px) {
                .gradient-selector-container {
                    bottom: 1.5rem !important;
                    left: 1rem !important;
                    top: auto !important;
                    right: auto !important;

            }

            /* Large screens */

                .gradient-selector-container {
                    bottom: 1.5rem !important;
                    left: 1.5rem !important;
                    top: auto !important;
                    right: auto !important;
                    transform: none !important;
                }
            }

function setAppearance(mode) {
    localStorage.setItem('flux_appearance', mode);
    localStorage.setItem('color-theme', mode);

    if (mode === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
    } else if (mode === 'light') {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
    } else {
        // System - detect
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
        } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
        }
    }

    // Dispatch custom event for components to react
    window.dispatchEvent(new CustomEvent('themechange', {
        detail: { type: 'appearance', mode: mode }
    }));
}

// Accessibility Settings Setter Function (global)
function setAccessibilitySetting(setting, value) {
    const storageKey = 'accessibility_' + setting;
    localStorage.setItem(storageKey, value);

    if (setting === 'font_size') {
        document.documentElement.setAttribute('data-font-size', value);
    } else if (value === 'true') {
        document.documentElement.setAttribute('data-' + setting.replace('_', '-') + '-mode', 'true');
    } else {
        document.documentElement.removeAttribute('data-' + setting.replace('_', '-') + '-mode');
    }

    // Dispatch custom event for components to react
    window.dispatchEvent(new CustomEvent('accessibilitychange', {
        detail: { setting: setting, value: value }
    }));
}

    <script id="browser-logger-active">
(function() {
    const ENDPOINT = 'http://127.0.0.1:8000/_boost/browser-logs';
    const logQueue = [];
    let flushTimeout = null;

    console.log('🔍 Browser logger active (MCP server detected). Posting to: ' + ENDPOINT);

    // Store original console methods
    const originalConsole = {
        log: console.log,
        info: console.info,
        error: console.error,
        warn: console.warn,
        table: console.table
    };

    // Helper to safely stringify values
    function safeStringify(obj) {
        const seen = new WeakSet();
        return JSON.stringify(obj, (key, value) => {
            if (typeof value === 'object' && value !== null) {
                if (seen.has(value)) return '[Circular]';
                seen.add(value);
            }
            if (value instanceof Error) {
                return {
                    name: value.name,
                    message: value.message,
                    stack: value.stack
                };
            }
            return value;
        });
    }

    // Batch and send logs
    function flushLogs() {
        if (logQueue.length === 0) return;

        const batch = logQueue.splice(0, logQueue.length);

        fetch(ENDPOINT, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ logs: batch })
        }).catch(err => {
            // Silently fail to avoid infinite loops
            originalConsole.error('Failed to send logs:', err);
        });
    }

    // Debounced flush (100ms)
    function scheduleFlush() {
        if (flushTimeout) clearTimeout(flushTimeout);
        flushTimeout = setTimeout(flushLogs, 100);
    }

    // Intercept console methods
    ['log', 'info', 'error', 'warn', 'table'].forEach(method => {
        console[method] = function(...args) {
            // Call original method
            originalConsole[method].apply(console, args);

            // Capture log data
            try {
                logQueue.push({
                    type: method,
                    timestamp: new Date().toISOString(),
                    data: args.map(arg => {
                        try {
                            return typeof arg === 'object' ? JSON.parse(safeStringify(arg)) : arg;
                        } catch (e) {
                            return String(arg);
                        }
                    }),
                    url: window.location.href,
                    userAgent: navigator.userAgent
                });

                scheduleFlush();
            } catch (e) {
                // Fail silently
            }
        };
    });

    // Global error handlers for uncaught errors
    const originalOnError = window.onerror;
    window.onerror = function boostErrorHandler(errorMsg, url, lineNumber, colNumber, error) {
        try {
            logQueue.push({
                type: 'uncaught_error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: errorMsg,
                    filename: url,
                    lineno: lineNumber,
                    colno: colNumber,
                    error: error ? {
                        name: error.name,
                        message: error.message,
                        stack: error.stack
                    } : null
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Call original handler if it exists
        if (originalOnError && typeof originalOnError === 'function') {
            return originalOnError(errorMsg, url, lineNumber, colNumber, error);
        }

        // Let the error continue to propagate
        return false;
    }
    window.addEventListener('error', (event) => {
        try {
            logQueue.push({
                type: 'window_error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: event.message,
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno,
                    error: event.error ? {
                        name: event.error.name,
                        message: event.error.message,
                        stack: event.error.stack
                    } : null
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the error continue to propagate
        return false;
    });
    window.addEventListener('unhandledrejection', (event) => {
        try {
            logQueue.push({
                type: 'error',
                timestamp: new Date().toISOString(),
                data: [{
                    message: 'Unhandled Promise Rejection',
                    reason: event.reason instanceof Error ? {
                        name: event.reason.name,
                        message: event.reason.message,
                        stack: event.reason.stack
                    } : event.reason
                }],
                url: window.location.href,
                userAgent: navigator.userAgent
            });

            scheduleFlush();
        } catch (e) {
            // Fail silently
        }

        // Let the rejection continue to propagate
        return false;
    });

    // Flush on page unload
    window.addEventListener('beforeunload', () => {
        if (logQueue.length > 0) {
            navigator.sendBeacon(ENDPOINT, JSON.stringify({ logs: logQueue }));
        }
    });
